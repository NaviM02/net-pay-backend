services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: netpay_db
      POSTGRES_USER: netpay
    env_file:
      - ${RUNTIME_DIR:-/etc/netpay}/db.env
    volumes:
      - netpay-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netpay -d netpay_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Sin ports: PostgreSQL solo es accesible dentro de la red privada de Compose.

  app:
    image: ${ECR_REPOSITORY}:${APP_IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ${RUNTIME_DIR:-/etc/netpay}/app.env
    environment:
      DB_URL: jdbc:postgresql://db:5432/netpay_db
      DB_USERNAME: netpay
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 20s
      timeout: 5s
      start_period: 90s
      retries: 5

  proxy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    environment:
      API_HOST: ${API_HOST}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${RUNTIME_DIR:-/etc/netpay}/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  netpay-db-data:
  caddy-data:
  caddy-config:
