<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>{{title}}</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f7;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f7;padding:32px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0"
                   style="width:600px;max-width:600px;background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 2px 12px rgba(15,23,42,0.08);">
                <tr>
                    <td style="background:#4f46e5;padding:26px 32px;">
                        <div style="font-size:22px;font-weight:bold;color:#ffffff;letter-spacing:3px;">{{appName}}</div>
                        <div style="font-size:11px;color:#c7d2fe;letter-spacing:1px;margin-top:4px;">
                            SERVICIOS DE INTERNET &amp; TELECOMUNICACIONES
                        </div>
                    </td>
                </tr>
                <tr>
                    <td style="padding:36px 32px 8px 32px;">
                        <h1 style="margin:0 0 20px 0;font-size:20px;color:#111827;">{{title}}</h1>
                    </td>
                </tr>
                <tr>
                    <td style="padding:0 32px 36px 32px;">
                        {{content}}
                    </td>
                </tr>
                <tr>
                    <td style="background:#f9fafb;border-top:1px solid #e5e7eb;padding:20px 32px;text-align:center;">
                        <div style="font-size:11px;color:#9ca3af;line-height:1.6;">
                            Este es un mensaje automático de {{appName}}. Por favor no respondas a este correo.<br/>
                            &copy; {{currentYear}} {{appName}}. Todos los derechos reservados.
                        </div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
