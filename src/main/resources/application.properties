spring.application.name=net-pay-backend

# Optional local secrets (not committed). See .env.example
spring.config.import=optional:file:.env[.properties]

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/netpay_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configurations
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}

# Flyway Settings
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.locations=classpath:db/migration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

security.jwt.expiration=${JWT_EXPIRATION:3600}
security.jwt.secret=${JWT_SECRET}

# Cloudinary (receipt PDF storage). Leave blank to disable cloud upload.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.folder=${CLOUDINARY_FOLDER:netpay/receipts}
cloudinary.uploads-folder=${CLOUDINARY_UPLOADS_FOLDER:netpay/uploads}

# Gmail API (OAuth2 refresh token; no SMTP)
gmail.api.client-id=${GMAIL_CLIENT_ID:}
gmail.api.client-secret=${GMAIL_CLIENT_SECRET:}
gmail.api.refresh-token=${GMAIL_REFRESH_TOKEN:}
gmail.api.from-email=${GMAIL_FROM_EMAIL:}

# Password recovery
security.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:30}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:4200}

# CORS: lista de orígenes permitidos separados por comas
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Spreadsheet/CSV imports: at most 5 MiB per file.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
