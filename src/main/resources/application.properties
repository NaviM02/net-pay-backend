spring.application.name=net-pay-backend

# Optional local secrets (not committed). See .env.example
spring.config.import=optional:file:.env[.properties]

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/netpay_db}
spring.datasource.username=${DB_USERNAME:dtzunun_cunoc}
spring.datasource.password=${DB_PASSWORD:T@zi99k2}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configurations
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway Settings
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.locations=classpath:db/migration

security.jwt.expiration=${JWT_EXPIRATION:3600}
security.jwt.secret=${JWT_SECRET:bWlfY2xhdmVfc2VjcmV0YV91bml2ZXJzaXRhcmlhX3BhcmFfbmV0cGF5XzIwMjZfMTIzNDU2Nzg5MA==}

# Cloudinary (receipt PDF storage). Leave blank to disable cloud upload.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.folder=${CLOUDINARY_FOLDER:netpay/receipts}
