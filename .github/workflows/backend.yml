name: Backend CI/CD

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: netpay_ci
          POSTGRES_USER: netpay_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U netpay_ci -d netpay_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB_URL: jdbc:postgresql://localhost:5432/netpay_ci
      DB_USERNAME: netpay_ci
      DB_PASSWORD: ci-only-unused-password
      JWT_SECRET: ci-only-key-for-automated-tests-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run tests and compile
        run: ./mvnw -B verify
      - name: Validate Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.0
      - name: Terraform format and validation (no AWS credentials)
        working-directory: infra/terraform
        run: |
          terraform fmt -check
          terraform init -backend=false -input=false
          terraform validate
      - name: Validate production Compose topology
        env:
          RUNTIME_DIR: /tmp/netpay
          APP_IMAGE_TAG: 0123456789012345678901234567890123456789
          ECR_REPOSITORY: 123456789012.dkr.ecr.us-east-1.amazonaws.com/netpay-backend
          API_HOST: 203.0.113.10
          ACME_EMAIL: student@example.invalid
          DB_PASSWORD: ci-only-placeholder
          JWT_SECRET: ci-only-placeholder
          FRONTEND_BASE_URL: https://frontend.example.invalid
          CORS_ALLOWED_ORIGINS: https://frontend.example.invalid
        run: |
          set -euo pipefail
          mkdir -p "$RUNTIME_DIR"
          touch "$RUNTIME_DIR/app.env" "$RUNTIME_DIR/db.env"
          config=$(docker compose -f compose.prod.yml config --no-env-resolution --format json)
          python3 -c '
          import json, sys
          config = json.load(sys.stdin)
          assert not config["services"]["db"].get("ports"), "PostgreSQL must remain private"
          assert {port["target"] for port in config["services"]["proxy"]["ports"]} == {80, 443}
          assert config["services"]["app"].get("expose") == ["8080"]
          ' <<< "$config"
      - name: Build Docker image (not published)
        run: docker build --tag netpay:ci .

  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    concurrency:
      group: netpay-production
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      SSM_DEPLOY_DOCUMENT: ${{ vars.SSM_DEPLOY_DOCUMENT }}
      AWS_DEPLOY_ACCESS_KEY_ID: ${{ secrets.AWS_DEPLOY_ACCESS_KEY_ID }}
      AWS_DEPLOY_SECRET_ACCESS_KEY: ${{ secrets.AWS_DEPLOY_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${AWS_REGION:?Set repository variable AWS_REGION}"
          : "${AWS_DEPLOY_ACCESS_KEY_ID:?Set secret AWS_DEPLOY_ACCESS_KEY_ID}"
          : "${AWS_DEPLOY_SECRET_ACCESS_KEY:?Set secret AWS_DEPLOY_SECRET_ACCESS_KEY}"
          : "${ECR_REPOSITORY_URL:?Set ECR_REPOSITORY_URL from Terraform output}"
          : "${EC2_INSTANCE_ID:?Set EC2_INSTANCE_ID from Terraform output}"
          : "${SSM_DEPLOY_DOCUMENT:?Set SSM_DEPLOY_DOCUMENT from Terraform output}"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_DEPLOY_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_DEPLOY_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Build and publish immutable image to ECR
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "${ECR_REPOSITORY_URL%%/*}"
          docker build --tag "$ECR_REPOSITORY_URL:$GITHUB_SHA" .
          docker push "$ECR_REPOSITORY_URL:$GITHUB_SHA"
      - name: Deploy through SSM and wait for health check
        shell: bash
        run: |
          set -euo pipefail
          parameters=$(jq -n --arg release "$GITHUB_SHA" '{Release:[$release]}')
          command_id=$(aws ssm send-command \
            --document-name "$SSM_DEPLOY_DOCUMENT" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --parameters "$parameters" \
            --query Command.CommandId --output text)
          for _ in {1..90}; do
            status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" --query Status --output text 2>/dev/null || true)
            case "$status" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation --command-id "$command_id" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Status:Status,Error:StandardErrorContent}' --output json
                exit 1
                ;;
            esac
            sleep 10
          done
          aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Error:StandardErrorContent}' --output json
          exit 1
